name: Déploiement Shopify

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Déployer le thème
        run: |
          shopify theme push \
            --store="${{ secrets.SHOPIFY_STORE }}" \
            --theme="${{ secrets.SHOPIFY_THEME_ID }}" \
            --no-color \
            --allow-live
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
